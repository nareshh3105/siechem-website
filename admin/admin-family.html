<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Catalogue — Siechem Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/favicon.png">
<link rel="stylesheet" href="/theme.css">
<style>
  .admin-topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 28px; border-bottom: 1px solid var(--border); background: var(--bg-card);
  }
  .admin-topbar .brand { font-weight: 700; font-size: 17px; color: var(--text); }
  .admin-topbar .brand a { color: var(--text-muted); font-weight: 400; font-size: 13px; margin-right: 10px; text-decoration: none; }
  .admin-wrap { max-width: 1300px; margin: 0 auto; padding: 28px 24px 100px; display: grid; grid-template-columns: 260px 1fr; gap: 24px; }
  @media (max-width: 900px) { .admin-wrap { grid-template-columns: 1fr; } }

  .series-list { border: 1px solid var(--border); border-radius: 10px; background: var(--bg-card); overflow: hidden; align-self: start; }
  .series-list h2 { font-size: 13px; padding: 14px 16px; border-bottom: 1px solid var(--border); color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; }
  .series-item {
    display: flex; align-items: center; justify-content: space-between; padding: 11px 16px;
    font-size: 13.5px; cursor: pointer; border-bottom: 1px solid var(--border); color: var(--text);
  }
  .series-item:hover { background: var(--bg-soft); }
  .series-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .add-series-btn { width: 100%; padding: 12px 16px; font-size: 13px; color: var(--accent); background: none; border: none; cursor: pointer; text-align: left; }
  .add-series-btn:hover { background: var(--bg-soft); }

  .editor-panel { min-height: 300px; }
  .editor-empty { color: var(--text-muted); padding: 60px 0; text-align: center; }
  .editor-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .editor-head input.name-input { font-size: 18px; font-weight: 700; border: 1px solid transparent; padding: 6px 8px; border-radius: 6px; background: none; flex: 1; min-width: 200px; }
  .editor-head input.name-input:hover, .editor-head input.name-input:focus { border-color: var(--border); background: var(--bg-card); }

  table.spec-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 14px; }
  table.spec-table th { background: var(--bg-soft); text-align: left; padding: 8px 6px; border: 1px solid var(--border); }
  table.spec-table th input { width: 100%; border: none; background: none; font-weight: 600; font-size: 12.5px; }
  table.spec-table td { border: 1px solid var(--border); padding: 0; }
  table.spec-table td input { width: 100%; border: none; padding: 7px 8px; font-size: 13px; background: none; }
  table.spec-table td input:focus, table.spec-table th input:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
  table.spec-table td.row-actions, table.spec-table th.col-actions { width: 34px; text-align: center; }
  table.spec-table td.row-actions button { border: none; background: none; color: var(--text-dim); cursor: pointer; font-size: 15px; }
  table.spec-table td.row-actions button:hover { color: #B91C1C; }

  .table-actions { display: flex; gap: 10px; margin-bottom: 24px; }

  .info-editor { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  @media (max-width: 700px) { .info-editor { grid-template-columns: 1fr; } }
  .info-editor .block { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .info-editor .block h4 { font-size: 12.5px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
  .info-editor textarea { width: 100%; min-height: 90px; border: 1px solid var(--border); border-radius: 6px; padding: 8px; font-size: 12.5px; font-family: inherit; resize: vertical; }
  .info-editor p.hint { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

  .save-bar { display: flex; align-items: center; gap: 12px; }
  #saveMsg { font-size: 12.5px; }
</style>
</head>
<body>
  <div class="admin-topbar">
    <div class="brand"><a href="/admin/admin.html">&larr; All Segments</a><span id="familyName">Loading…</span></div>
    <button class="btn btn-ghost btn-sm" onclick="SiechemAdmin.logout()">Log Out</button>
  </div>

  <div class="admin-wrap">
    <div class="series-list">
      <h2>Types</h2>
      <div id="seriesListItems"></div>
      <button class="add-series-btn" id="addSeriesBtn">+ Add New Type</button>
    </div>

    <div class="editor-panel" id="editorPanel">
      <div class="editor-empty">Select a type on the left to edit its specification table.</div>
    </div>
  </div>

  <script src="/assets/admin.js"></script>
  <script>
    SiechemAdmin.requireAuth();

    const params = new URLSearchParams(location.hash.slice(1) || location.search);
    const familyId = params.get('f');
    if (!familyId) document.getElementById('familyName').textContent = 'No family specified';

    let seriesData = [];
    let activeId = null;

    function newSeries() {
      return {
        id: 'new-' + Date.now().toString(36),
        family: familyId,
        name: 'New Type',
        headers: ['S.No', 'Type', 'Conductor', 'Insulation', 'Spec', 'Temp. Range'],
        rows: [],
        info: null,
        _isNew: true
      };
    }

    function renderSeriesList() {
      const el = document.getElementById('seriesListItems');
      el.innerHTML = seriesData.map(s => `
        <div class="series-item ${s.id === activeId ? 'active' : ''}" data-id="${s.id}">
          <span>${s.name || '(unnamed)'}</span>
        </div>
      `).join('');
      el.querySelectorAll('.series-item').forEach(item => {
        item.addEventListener('click', () => {
          activeId = item.dataset.id;
          renderSeriesList();
          renderEditor();
        });
      });
    }

    function renderEditor() {
      const panel = document.getElementById('editorPanel');
      const s = seriesData.find(x => x.id === activeId);
      if (!s) { panel.innerHTML = '<div class="editor-empty">Select a type on the left to edit its specification table.</div>'; return; }

      const headerCells = s.headers.map((h, i) => `
        <th><input type="text" data-h="${i}" value="${escapeAttr(h)}"></th>
      `).join('');

      const rowCells = s.rows.map((row, ri) => `
        <tr data-row="${ri}">
          ${s.headers.map((_, ci) => `<td><input type="text" data-r="${ri}" data-c="${ci}" value="${escapeAttr(row[ci] || '')}"></td>`).join('')}
          <td class="row-actions"><button data-del-row="${ri}" title="Delete row">&times;</button></td>
        </tr>
      `).join('');

      const infoBlocks = ['application', 'construction', 'technical', 'features'].map(key => {
        const label = { application: 'Application', construction: 'Product Construction', technical: 'Technical Data', features: 'Features' }[key];
        const lines = (s.info && s.info[key]) ? s.info[key].join('\n') : '';
        return `<div class="block">
          <h4>${label}</h4>
          <textarea data-info="${key}" placeholder="One bullet per line…">${escapeHtml(lines)}</textarea>
        </div>`;
      }).join('');

      panel.innerHTML = `
        <div class="editor-head">
          <input class="name-input" id="seriesNameInput" value="${escapeAttr(s.name)}">
          <button class="btn btn-ghost btn-sm" id="deleteSeriesBtn">Delete Type</button>
        </div>

        <h3 style="font-size:13px;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;">Application / Construction / Technical / Features</h3>
        <div class="info-editor">${infoBlocks}</div>

        <h3 style="font-size:13px;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;">Size Range &amp; Part Numbers</h3>
        <div style="overflow-x:auto;">
          <table class="spec-table">
            <thead><tr>${headerCells}<th class="col-actions"></th></tr></thead>
            <tbody id="specRows">${rowCells}</tbody>
          </table>
        </div>
        <div class="table-actions">
          <button class="btn btn-ghost btn-sm" id="addRowBtn">+ Add Row</button>
          <button class="btn btn-ghost btn-sm" id="addColBtn">+ Add Column</button>
        </div>

        <div class="save-bar">
          <button class="btn btn-primary" id="saveBtn">Save Changes</button>
          <span id="saveMsg"></span>
        </div>
      `;

      panel.querySelectorAll('[data-h]').forEach(inp => inp.addEventListener('input', e => {
        s.headers[+e.target.dataset.h] = e.target.value;
      }));
      panel.querySelectorAll('[data-r]').forEach(inp => inp.addEventListener('input', e => {
        s.rows[+e.target.dataset.r][+e.target.dataset.c] = e.target.value;
      }));
      panel.querySelectorAll('[data-del-row]').forEach(btn => btn.addEventListener('click', e => {
        s.rows.splice(+e.target.dataset.delRow, 1);
        renderEditor();
      }));
      panel.querySelectorAll('[data-info]').forEach(ta => ta.addEventListener('input', e => {
        const key = e.target.dataset.info;
        const lines = e.target.value.split('\n').map(l => l.trim()).filter(Boolean);
        if (!s.info) s.info = {};
        s.info[key] = lines;
      }));
      document.getElementById('seriesNameInput').addEventListener('input', e => {
        s.name = e.target.value;
        renderSeriesList();
      });
      document.getElementById('addRowBtn').addEventListener('click', () => {
        s.rows.push(new Array(s.headers.length).fill(''));
        renderEditor();
      });
      document.getElementById('addColBtn').addEventListener('click', () => {
        const name = prompt('Column name?');
        if (!name) return;
        s.headers.push(name);
        s.rows.forEach(r => r.push(''));
        renderEditor();
      });
      document.getElementById('deleteSeriesBtn').addEventListener('click', async () => {
        if (!confirm(`Delete "${s.name}"? This cannot be undone.`)) return;
        if (!s._isNew) {
          try { await SiechemAdmin.api('/api/admin-series', { method: 'DELETE', body: JSON.stringify({ family: familyId, id: s.id }) }); }
          catch (e) { alert('Delete failed: ' + e.message); return; }
        }
        seriesData = seriesData.filter(x => x.id !== s.id);
        activeId = null;
        renderSeriesList();
        renderEditor();
      });
      document.getElementById('saveBtn').addEventListener('click', async () => {
        const msg = document.getElementById('saveMsg');
        const btn = document.getElementById('saveBtn');
        btn.disabled = true;
        msg.style.color = 'var(--text-muted)';
        msg.textContent = 'Saving…';
        try {
          await SiechemAdmin.api('/api/admin-series', {
            method: s._isNew ? 'POST' : 'PUT',
            body: JSON.stringify({ family: familyId, id: s.id, name: s.name, headers: s.headers, rows: s.rows, info: s.info })
          });
          s._isNew = false;
          msg.style.color = '#15803D';
          msg.textContent = 'Saved as draft. Click "Publish Changes" on the dashboard to go live.';
        } catch (e) {
          msg.style.color = '#B91C1C';
          msg.textContent = 'Save failed: ' + e.message;
        } finally {
          btn.disabled = false;
        }
      });
    }

    function escapeAttr(s) { return String(s ?? '').replace(/"/g, '&quot;'); }
    function escapeHtml(s) { return String(s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

    document.getElementById('addSeriesBtn').addEventListener('click', () => {
      const s = newSeries();
      seriesData.push(s);
      activeId = s.id;
      renderSeriesList();
      renderEditor();
    });

    async function load() {
      try {
        const { family, series } = await SiechemAdmin.api(`/api/admin-series?family=${encodeURIComponent(familyId)}`);
        document.getElementById('familyName').textContent = family.name;
        seriesData = series.map(s => ({ ...s, family: familyId }));
        renderSeriesList();
      } catch (e) {
        document.getElementById('familyName').textContent = 'Error: ' + e.message;
      }
    }
    if (familyId) load();
  </script>
</body>
</html>
