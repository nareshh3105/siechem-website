<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Catalogue — Siechem Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/favicon.png">
<link rel="stylesheet" href="/theme.css">
<style>
  body { background: var(--bg-soft); }
  .admin-topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px; border-bottom: 1px solid var(--border); background: var(--bg-card);
    position: sticky; top: 0; z-index: 10;
  }
  .admin-topbar .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .admin-topbar .brand img { height: 26px; border-radius: 4px; flex-shrink: 0; }
  .admin-topbar .brand a {
    display: inline-flex; align-items: center; gap: 4px; color: var(--text-muted); font-weight: 500;
    font-size: 13px; text-decoration: none; flex-shrink: 0;
  }
  .admin-topbar .brand a:hover { color: var(--accent); }
  .admin-topbar .brand .sep { color: var(--border-strong); flex-shrink: 0; }
  .admin-topbar .brand #familyName { font-weight: 700; font-size: 14.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .admin-wrap { max-width: 1320px; margin: 0 auto; padding: 24px 24px 100px; display: grid; grid-template-columns: 270px 1fr; gap: 20px; }
  /* Grid items default to min-width:auto, so content with its own min-width
     (e.g. .name-input below) can force the track wider than the viewport
     instead of shrinking or wrapping — min-width:0 lets them shrink properly. */
  .admin-wrap > * { min-width: 0; }
  @media (max-width: 900px) { .admin-wrap { grid-template-columns: 1fr; } }

  .series-list { border: 1px solid var(--border); border-radius: 12px; background: var(--bg-card); overflow: hidden; align-self: start; position: sticky; top: 80px; }
  @media (max-width: 900px) {
    /* A sticky sidebar-with-its-own-scroll-region is awkward once it's
       stacked above the editor instead of beside it — let it scroll inline. */
    .series-list { position: static; }
  }
  .series-list-head { padding: 13px 15px 10px; border-bottom: 1px solid var(--border); }
  .series-list-head h2 { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; margin-bottom: 8px; }
  .series-search { position: relative; }
  .series-search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text-dim); }
  .series-search input {
    width: 100%; padding: 7px 10px 7px 28px; border: 1.5px solid var(--border); border-radius: 7px;
    font-size: 12.5px; outline: none; transition: border-color .15s;
  }
  .series-search input:focus { border-color: var(--accent); }
  #seriesListItems { max-height: 60vh; overflow-y: auto; }
  .series-item {
    position: relative; display: flex; align-items: center; justify-content: space-between; padding: 10px 15px 10px 18px;
    font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--border); color: var(--text-muted);
    transition: background .12s, color .12s;
  }
  .series-item:last-child { border-bottom: none; }
  .series-item:hover { background: var(--bg-soft); color: var(--text); }
  .series-item.active { background: var(--accent-soft); color: var(--accent-2); font-weight: 600; }
  .series-item.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); }
  .series-item .row-count { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); flex-shrink: 0; margin-left: 8px; }
  .series-item.active .row-count { color: var(--accent); }
  .add-series-btn {
    display: flex; align-items: center; gap: 6px; width: 100%; padding: 12px 16px; font-size: 13px;
    font-weight: 600; color: var(--accent); background: var(--bg-soft); border: none; border-top: 1px solid var(--border);
    cursor: pointer; text-align: left;
  }
  .add-series-btn:hover { background: var(--accent-soft); }

  .editor-panel { min-height: 300px; }
  .editor-empty {
    color: var(--text-muted); padding: 90px 20px; text-align: center; background: var(--bg-card);
    border: 1px dashed var(--border-strong); border-radius: 12px; font-size: 13.5px;
  }
  .editor-head {
    display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
  }
  .editor-head input.name-input {
    font-size: 17px; font-weight: 700; border: 1px solid transparent; padding: 7px 9px; border-radius: 7px;
    background: none; flex: 1; min-width: 200px; color: var(--text);
  }
  .editor-head input.name-input:hover, .editor-head input.name-input:focus { border-color: var(--border); background: var(--bg-soft); }
  .btn-danger-ghost {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600;
    color: #B91C1C; background: none; border: 1px solid #FCA5A5; border-radius: 8px; padding: 8px 14px; cursor: pointer;
    transition: background .15s;
  }
  .btn-danger-ghost:hover { background: #FEF2F2; }
  .btn-danger-ghost.btn-sm { padding: 6px 12px; font-size: 12.5px; }

  .card-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 18px; }

  .image-uploader { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .image-preview {
    width: 96px; height: 96px; flex-shrink: 0; border-radius: 10px;
    background: #fff; border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .image-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .image-preview-empty { font-size: 11px; color: var(--text-dim); font-family: var(--mono); }
  .image-uploader-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .image-upload-status { font-size: 12px; color: var(--text-dim); font-family: var(--mono); }
  .image-upload-status.error { color: #B91C1C; }
  .image-upload-status.success { color: #15803D; }
  @media (max-width: 480px) {
    .admin-topbar { padding: 12px 16px; }
    .admin-topbar .brand a span, .admin-topbar .brand a { font-size: 12.5px; }
    .admin-wrap { padding: 16px 16px 90px; gap: 14px; }
    .card-section { padding: 14px; }
    .editor-head { padding: 12px 14px; }
    /* 200px was sized for the desktop two-column layout; on a single-column
       mobile card it leaves no room for the delete button beside it and
       forces the whole card wider than the viewport. */
    .editor-head input.name-input { min-width: 0; font-size: 15px; }
  }
  .card-section-title {
    display: flex; align-items: center; gap: 7px; font-size: 12.5px; text-transform: uppercase;
    color: var(--text-muted); font-weight: 700; letter-spacing: .04em; margin-bottom: 14px;
  }
  .card-section-title svg { color: var(--accent); }

  .info-editor { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 700px) { .info-editor { grid-template-columns: 1fr; } }
  .info-editor .block { border: 1px solid var(--border); border-radius: 9px; padding: 11px 13px; background: var(--bg-soft); }
  .info-editor .block h4 { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; }
  .info-editor .block h4 .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .info-editor textarea {
    width: 100%; min-height: 84px; border: 1px solid var(--border); border-radius: 7px; padding: 8px;
    font-size: 12.5px; font-family: inherit; resize: vertical; background: var(--bg-card); outline: none; transition: border-color .15s;
  }
  .info-editor textarea:focus { border-color: var(--accent); }

  .table-scroll { overflow-x: auto; border-radius: 9px; border: 1px solid var(--border); }
  /* table-layout:auto (not fixed) lets each column grow to fit its content
     instead of being squeezed into an equal/percentage split — if the sum
     exceeds the card width, .table-scroll's overflow-x:auto kicks in rather
     than truncating anything. */
  table.spec-table { min-width: 100%; table-layout: auto; border-collapse: collapse; font-size: 15px; }
  table.spec-table th { background: var(--bg-soft); text-align: center; padding: 10px 10px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); vertical-align: bottom; }
  table.spec-table th input, table.spec-table th textarea { width: 100%; border: none; background: none; padding: 0; display: block; font-family: inherit; text-align: center; }
  table.spec-table th textarea.h-label {
    font-weight: 600; font-size: 13px; color: var(--text); resize: none; overflow: hidden;
    white-space: normal; word-break: break-word; line-height: 1.25;
  }
  table.spec-table th input.h-unit { font-weight: 500; font-size: 11px; color: var(--text-faint); margin-top: 2px; }
  table.spec-table td { border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); padding: 0; }
  table.spec-table tr:last-child td { border-bottom: none; }
  table.spec-table tbody tr:hover td { background: rgba(184,115,51,0.035); }
  table.spec-table td input { width: 100%; border: none; padding: 10px 10px; font-size: 14.5px; background: none; text-align: center; }
  table.spec-table td input:focus, table.spec-table th input:focus, table.spec-table th textarea:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
  /* Lock the Part Number column in place during horizontal scroll. */
  table.spec-table th:first-child, table.spec-table td:first-child {
    position: sticky; left: 0; z-index: 2;
    box-shadow: 1px 0 0 0 var(--border);
  }
  table.spec-table th:first-child { background: var(--bg-soft); z-index: 3; }
  table.spec-table td:first-child { background: var(--bg-card); }
  table.spec-table tbody tr:hover td:first-child { background: #FBF7F2; }

  table.spec-table td.row-actions, table.spec-table th.col-actions { width: 36px; text-align: center; border-right: none; }
  table.spec-table td.row-actions button { border: none; background: none; color: var(--text-dim); cursor: pointer; font-size: 17px; padding: 6px; border-radius: 4px; }
  table.spec-table td.row-actions button:hover { color: #B91C1C; background: #FEF2F2; }
  table.spec-table th button.col-del {
    border: none; background: none; color: var(--text-dim); cursor: pointer;
    font-size: 15px; padding: 2px 6px; border-radius: 4px; display: block; margin: 0 auto 4px;
  }
  table.spec-table th button.col-del:hover { color: #B91C1C; background: #FEF2F2; }

  .table-actions { display: flex; gap: 10px; margin-top: 14px; }
  .table-actions .btn { display: inline-flex; align-items: center; gap: 6px; }

  .save-bar {
    position: sticky; bottom: 0; display: flex; align-items: center; gap: 14px; margin-top: 18px; flex-wrap: wrap;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px;
    box-shadow: 0 -8px 24px rgba(0,0,0,0.06);
  }
  #saveMsg { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500; color: var(--text-muted); }
  #saveMsg .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--text-dim); }
  #saveMsg.pending .dot { background: #D97706; }
  #saveMsg.saving .dot { background: #2563EB; animation: pulse 1s ease-in-out infinite; }
  #saveMsg.saved .dot { background: #16A34A; }
  #saveMsg.error .dot { background: #DC2626; }
  #saveMsg.saving { color: #2563EB; }
  #saveMsg.saved { color: #15803D; }
  #saveMsg.error { color: #B91C1C; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
</style>
</head>
<body>
  <div class="admin-topbar">
    <div class="brand">
      <img src="/assets/logo.jpg" alt="Siechem">
      <a href="/admin/admin.html">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M11 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        All Segments
      </a>
      <span class="sep">/</span>
      <span id="familyName">Loading…</span>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="SiechemAdmin.logout()">Log Out</button>
  </div>

  <div class="admin-wrap">
    <div class="series-list">
      <div class="series-list-head">
        <h2>Types</h2>
        <div class="series-search">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="text" id="typeSearchInput" placeholder="Filter types…" autocomplete="off">
        </div>
      </div>
      <div id="seriesListItems"></div>
      <button class="add-series-btn" id="addSeriesBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Add New Type
      </button>
    </div>

    <div class="editor-panel" id="editorPanel">
      <div class="editor-empty">Select a type on the left to edit its specification table.</div>
    </div>
  </div>

  <script src="/assets/admin.js"></script>
  <script>
    SiechemAdmin.requireAuth();

    const params = new URLSearchParams(location.hash.slice(1) || location.search);
    const familyId = params.get('f');
    if (!familyId) document.getElementById('familyName').textContent = 'No family specified';

    let seriesData = [];
    let activeId = null;

    // ── Autosave ──────────────────────────────────────────────────────
    // Edits save automatically after a short pause in typing. "Save Now"
    // stays available for an explicit immediate save. Publishing to the
    // live site remains a separate, manual action on the dashboard.
    const AUTOSAVE_DELAY_MS = 1200;
    let autosaveTimer = null;
    let autosaveSeriesId = null;

    function setSaveStatus(state, text) {
      const msg = document.getElementById('saveMsg');
      if (!msg) return;
      msg.className = state;
      msg.innerHTML = '<span class="dot"></span>' + text;
    }

    function scheduleAutosave(s) {
      clearTimeout(autosaveTimer);
      autosaveSeriesId = s.id;
      setSaveStatus('pending', 'Unsaved changes…');
      autosaveTimer = setTimeout(() => saveSeries(s), AUTOSAVE_DELAY_MS);
    }

    // Flushes a pending autosave immediately (used before switching type,
    // deleting, or navigating away) so a debounced edit is never lost.
    async function flushAutosave() {
      if (!autosaveTimer) return;
      clearTimeout(autosaveTimer);
      autosaveTimer = null;
      const s = seriesData.find(x => x.id === autosaveSeriesId);
      if (s) await saveSeries(s);
    }

    async function saveSeries(s) {
      clearTimeout(autosaveTimer);
      autosaveTimer = null;
      const btn = document.getElementById('saveBtn');
      setSaveStatus('saving', 'Saving…');
      if (btn) btn.disabled = true;
      try {
        await SiechemAdmin.api('/api/admin-series', {
          method: s._isNew ? 'POST' : 'PUT',
          body: JSON.stringify({ family: familyId, id: s.id, name: s.name, headers: s.headers, rows: s.rows, info: s.info })
        });
        s._isNew = false;
        setSaveStatus('saved', 'Saved automatically · Publish on the dashboard to go live');
      } catch (e) {
        setSaveStatus('error', 'Save failed: ' + e.message);
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    window.addEventListener('beforeunload', (e) => {
      if (autosaveTimer) { e.preventDefault(); e.returnValue = ''; }
    });

    function newSeries() {
      return {
        id: 'new-' + Date.now().toString(36),
        family: familyId,
        name: 'New Type',
        headers: ['S.No', 'Type', 'Conductor', 'Insulation', 'Spec', 'Temp. Range'],
        rows: [],
        info: null,
        _isNew: true
      };
    }

    function renderSeriesList() {
      const el = document.getElementById('seriesListItems');
      const q = (document.getElementById('typeSearchInput').value || '').trim().toLowerCase();
      const filtered = !q ? seriesData : seriesData.filter(s => (s.name || '').toLowerCase().includes(q));
      if (!filtered.length) {
        el.innerHTML = '<div style="padding:16px;font-size:12.5px;color:var(--text-dim);text-align:center;">No types match.</div>';
        return;
      }
      el.innerHTML = filtered.map(s => `
        <div class="series-item ${s.id === activeId ? 'active' : ''}" data-id="${s.id}">
          <span>${escapeHtml(s.name) || '(unnamed)'}</span>
          <span class="row-count">${s.rows.length}</span>
        </div>
      `).join('');
      el.querySelectorAll('.series-item').forEach(item => {
        item.addEventListener('click', async () => {
          if (item.dataset.id === activeId) return;
          await flushAutosave();
          activeId = item.dataset.id;
          renderSeriesList();
          renderEditor();
        });
      });
    }

    function renderEditor() {
      const panel = document.getElementById('editorPanel');
      const s = seriesData.find(x => x.id === activeId);
      if (!s) { panel.innerHTML = '<div class="editor-empty">Select a type on the left to edit its specification table.</div>'; return; }

      // Auto layout needs a per-column floor or narrow-value columns (e.g. a
      // 2-digit strand count) collapse to nothing next to wide ones instead
      // of each column getting room for its own content.
      const colMinWidths = computeColumnWidths(s.headers, s.rows);
      const headerCells = s.headers.map((h, i) => {
        const { label, unit } = splitHeaderLabelUnit(h);
        return `<th style="min-width:${colMinWidths[i]}ch">
          <button class="col-del" data-del-col="${i}" title="Delete column">&times;</button>
          <textarea class="h-label" data-h="${i}" rows="2" placeholder="Name">${escapeHtml(label)}</textarea>
          <input type="text" class="h-unit" data-hu="${i}" value="${escapeAttr(unit)}" placeholder="Unit">
        </th>`;
      }).join('');

      const rowCells = s.rows.map((row, ri) => `
        <tr data-row="${ri}">
          ${s.headers.map((_, ci) => `<td><input type="text" data-r="${ri}" data-c="${ci}" value="${escapeAttr(row[ci] || '')}"></td>`).join('')}
          <td class="row-actions"><button data-del-row="${ri}" title="Delete row">&times;</button></td>
        </tr>
      `).join('');

      const infoBlocks = ['application', 'construction', 'technical', 'features'].map(key => {
        const label = { application: 'Application', construction: 'Product Construction', technical: 'Technical Data', features: 'Features' }[key];
        const lines = (s.info && s.info[key]) ? s.info[key].join('\n') : '';
        return `<div class="block">
          <h4><span class="dot"></span>${label}</h4>
          <textarea data-info="${key}" placeholder="One bullet per line…">${escapeHtml(lines)}</textarea>
        </div>`;
      }).join('');

      panel.innerHTML = `
        <div class="editor-head">
          <input class="name-input" id="seriesNameInput" value="${escapeAttr(s.name)}">
          <button class="btn-danger-ghost" id="deleteSeriesBtn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Delete Type
          </button>
        </div>

        <div class="card-section">
          <div class="card-section-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.8"/><circle cx="8.5" cy="8.5" r="1.5" stroke="currentColor" stroke-width="1.8"/><path d="M21 15l-5-5L5 21" stroke="currentColor" stroke-width="1.8"/></svg>
            2D Product Image
          </div>
          <div class="image-uploader">
            <div class="image-preview" id="imagePreview">
              ${s.image_2d
                ? `<img src="${escapeAttr(s.image_2d)}" alt="">`
                : `<span class="image-preview-empty">No image</span>`}
            </div>
            <div class="image-uploader-actions">
              <input type="file" id="imageFileInput" accept="image/png,image/jpeg,image/webp" style="display:none;">
              <button class="btn btn-ghost btn-sm" id="imageUploadBtn" type="button">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 16V4M12 4l-5 5M12 4l5 5M4 20h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                ${s.image_2d ? 'Replace Image' : 'Upload Image'}
              </button>
              <button class="btn btn-danger-ghost btn-sm" id="imageRemoveBtn" type="button" style="${s.image_2d ? '' : 'display:none;'}">Remove</button>
              <span id="imageUploadStatus" class="image-upload-status"></span>
            </div>
          </div>
        </div>

        <div class="card-section">
          <div class="card-section-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 12l2 2 4-4M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9 9 4.03 9 9z" stroke="currentColor" stroke-width="1.8"/></svg>
            Application / Construction / Technical / Features
          </div>
          <div class="info-editor">${infoBlocks}</div>
        </div>

        <div class="card-section">
          <div class="card-section-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18M9 4v16" stroke="currentColor" stroke-width="1.8"/></svg>
            Size Range &amp; Part Numbers
            <span style="margin-left:auto;font-weight:500;text-transform:none;letter-spacing:0;color:var(--text-dim);">${s.rows.length} row${s.rows.length === 1 ? '' : 's'}</span>
          </div>
          <div class="table-scroll">
            <table class="spec-table">
              <thead><tr>${headerCells}<th class="col-actions"></th></tr></thead>
              <tbody id="specRows">${rowCells}</tbody>
            </table>
          </div>
          <div class="table-actions">
            <button class="btn btn-ghost btn-sm" id="addRowBtn">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              Add Row
            </button>
            <button class="btn btn-ghost btn-sm" id="addColBtn">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              Add Column
            </button>
          </div>
        </div>

        <div class="save-bar">
          <button class="btn btn-ghost" id="saveBtn">Save Now</button>
          <span id="saveMsg"><span class="dot"></span>No changes yet</span>
        </div>
      `;

      function syncHeader(i) {
        const label = panel.querySelector(`[data-h="${i}"]`).value.trim();
        const unit = panel.querySelector(`[data-hu="${i}"]`).value.trim();
        s.headers[i] = unit ? `${label} ${unit}` : label;
        scheduleAutosave(s);
      }
      panel.querySelectorAll('[data-h]').forEach(inp => inp.addEventListener('input', e => syncHeader(+e.target.dataset.h)));
      panel.querySelectorAll('[data-hu]').forEach(inp => inp.addEventListener('input', e => syncHeader(+e.target.dataset.hu)));
      panel.querySelectorAll('[data-r]').forEach(inp => inp.addEventListener('input', e => {
        s.rows[+e.target.dataset.r][+e.target.dataset.c] = e.target.value;
        scheduleAutosave(s);
      }));
      panel.querySelectorAll('[data-del-row]').forEach(btn => btn.addEventListener('click', e => {
        s.rows.splice(+e.target.dataset.delRow, 1);
        renderEditor();
        saveSeries(s);
      }));
      panel.querySelectorAll('[data-del-col]').forEach(btn => btn.addEventListener('click', e => {
        const ci = +e.target.dataset.delCol;
        const colName = (s.headers[ci] || '').trim() || `column ${ci + 1}`;
        if (!confirm(`Delete column "${colName}" and all its values? This cannot be undone.`)) return;
        s.headers.splice(ci, 1);
        s.rows.forEach(r => r.splice(ci, 1));
        renderEditor();
        saveSeries(s);
      }));
      panel.querySelectorAll('[data-info]').forEach(ta => ta.addEventListener('input', e => {
        const key = e.target.dataset.info;
        const lines = e.target.value.split('\n').map(l => l.trim()).filter(Boolean);
        if (!s.info) s.info = {};
        s.info[key] = lines;
        scheduleAutosave(s);
      }));
      document.getElementById('seriesNameInput').addEventListener('input', e => {
        s.name = e.target.value;
        renderSeriesList();
        scheduleAutosave(s);
      });
      document.getElementById('addRowBtn').addEventListener('click', () => {
        s.rows.push(new Array(s.headers.length).fill(''));
        renderEditor();
        saveSeries(s);
      });
      document.getElementById('addColBtn').addEventListener('click', () => {
        const name = prompt('Column name?');
        if (!name) return;
        s.headers.push(name);
        s.rows.forEach(r => r.push(''));
        renderEditor();
        saveSeries(s);
      });
      document.getElementById('deleteSeriesBtn').addEventListener('click', async () => {
        if (!confirm(`Delete "${s.name}"? This cannot be undone.`)) return;
        if (autosaveSeriesId === s.id) { clearTimeout(autosaveTimer); autosaveTimer = null; }
        if (!s._isNew) {
          try { await SiechemAdmin.api('/api/admin-series', { method: 'DELETE', body: JSON.stringify({ family: familyId, id: s.id }) }); }
          catch (e) { alert('Delete failed: ' + e.message); return; }
        }
        seriesData = seriesData.filter(x => x.id !== s.id);
        activeId = null;
        renderSeriesList();
        renderEditor();
      });
      document.getElementById('saveBtn').addEventListener('click', () => saveSeries(s));

      // ── 2D product image ──────────────────────────────────────────
      const imgStatus = document.getElementById('imageUploadStatus');
      function setImageStatus(cls, text) {
        imgStatus.className = 'image-upload-status' + (cls ? ' ' + cls : '');
        imgStatus.textContent = text;
      }
      document.getElementById('imageUploadBtn').addEventListener('click', () => {
        if (s._isNew) { alert('Save this type first (it needs to exist in the catalogue before you can attach an image), then upload.'); return; }
        document.getElementById('imageFileInput').click();
      });
      document.getElementById('imageFileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        e.target.value = '';
        if (!file) return;
        const okTypes = ['image/png', 'image/jpeg', 'image/webp'];
        if (!okTypes.includes(file.type)) {
          setImageStatus('error', 'Unsupported file type.');
          alert('Please choose a PNG, JPG or WebP image.');
          return;
        }
        setImageStatus('', 'Preparing…');
        try {
          // Downscale large photos/screenshots client-side (max 1400px on
          // the longest side) so admins never have to pre-compress an image
          // themselves -- also keeps every upload comfortably under the
          // ~4.5MB request-body ceiling Vercel functions enforce.
          const { mime, base64 } = await prepareImageForUpload(file);
          setImageStatus('', 'Uploading…');
          const res = await SiechemAdmin.api('/api/admin-image', {
            method: 'POST',
            body: JSON.stringify({ family: familyId, id: s.id, mime, base64 })
          });
          s.image_2d = res.url;
          renderEditor();
        } catch (err) {
          setImageStatus('error', 'Upload failed');
          alert('Image upload failed: ' + err.message);
        }
      });
      const removeBtn = document.getElementById('imageRemoveBtn');
      if (removeBtn) removeBtn.addEventListener('click', async () => {
        if (!confirm('Remove this image?')) return;
        setImageStatus('', 'Removing…');
        try {
          await SiechemAdmin.api('/api/admin-image', { method: 'DELETE', body: JSON.stringify({ family: familyId, id: s.id }) });
          s.image_2d = null;
          renderEditor();
        } catch (err) {
          setImageStatus('error', 'Remove failed: ' + err.message);
        }
      });
    }

    // Splits "Wire Size (AWG)" -> { label: "Wire Size", unit: "(AWG)" } so the
    // name and unit can render on separate lines instead of one long string.
    // Headers with multiple parenthetical groups (e.g. "Diameter (Nom.) (mm)")
    // keep everything from the first "(" onward as the unit line.
    function splitHeaderLabelUnit(h) {
      const s = String(h || '');
      const i = s.indexOf('(');
      if (i === -1) return { label: s, unit: '' };
      return { label: s.slice(0, i).trim(), unit: s.slice(i).trim() };
    }

    // Per-column minimum width (in ch) fed to table-layout:auto as a floor,
    // not a fixed split — columns can still grow past this to fit their
    // widest value. The label wraps onto two lines inside a <textarea>, so
    // it only needs about half its length; the unit line and row values
    // stay single-line and need their full length.
    function computeColumnWidths(headers, rows) {
      const sample = rows.slice(0, 30);
      return headers.map((h, i) => {
        const { label, unit } = splitHeaderLabelUnit(h);
        const labelFootprint = Math.ceil(label.length / 2);
        const maxValLen = sample.reduce((m, r) => Math.max(m, String(r[i] ?? '').length), 0);
        const need = Math.max(labelFootprint, unit.length, maxValLen);
        return Math.max(8, Math.min(28, need + 3));
      });
    }

    function escapeAttr(s) { return String(s ?? '').replace(/"/g, '&quot;'); }
    function escapeHtml(s) { return String(s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

    // Downscales a large image client-side before upload so admins never
    // have to pre-compress a phone photo or screenshot themselves, and so
    // the base64 payload always stays well under Vercel's ~4.5MB request
    // body ceiling. Small images pass through untouched (no quality loss).
    const IMG_MAX_DIM = 1400;
    const IMG_SMALL_ENOUGH_BYTES = 700 * 1024; // skip re-encoding if already small
    async function prepareImageForUpload(file) {
      const toBase64 = blobOrFile => new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result.split(',')[1]);
        r.onerror = () => reject(new Error('Could not read file'));
        r.readAsDataURL(blobOrFile);
      });

      if (file.size <= IMG_SMALL_ENOUGH_BYTES) {
        return { mime: file.type, base64: await toBase64(file) };
      }

      const dataUrl = await new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = () => reject(new Error('Could not read file'));
        r.readAsDataURL(file);
      });
      const img = await new Promise((resolve, reject) => {
        const el = new Image();
        el.onload = () => resolve(el);
        el.onerror = () => reject(new Error('Could not decode image'));
        el.src = dataUrl;
      });

      const scale = Math.min(1, IMG_MAX_DIM / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * scale));
      const h = Math.max(1, Math.round(img.naturalHeight * scale));
      if (scale === 1 && file.size <= 2.5 * 1024 * 1024) {
        // Already small enough in both dimensions and bytes -- upload as-is.
        return { mime: file.type, base64: await toBase64(file) };
      }

      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      // PNGs (renders with transparency) stay PNG; photos/screenshots
      // (JPEG/WebP source) re-encode as JPEG, which compresses far better.
      const outMime = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
      const blob = await new Promise(resolve => canvas.toBlob(resolve, outMime, 0.85));
      if (!blob) throw new Error('Could not compress image');
      if (blob.size > 2.5 * 1024 * 1024) throw new Error('Image is still too large after compression — please use a smaller source image');
      return { mime: outMime, base64: await toBase64(blob) };
    }

    document.getElementById('addSeriesBtn').addEventListener('click', async () => {
      await flushAutosave();
      const s = newSeries();
      seriesData.push(s);
      activeId = s.id;
      renderSeriesList();
      renderEditor();
    });

    document.getElementById('typeSearchInput').addEventListener('input', renderSeriesList);

    async function load() {
      try {
        const { family, series } = await SiechemAdmin.api(`/api/admin-series?family=${encodeURIComponent(familyId)}`);
        document.getElementById('familyName').textContent = family.name;
        seriesData = series.map(s => ({ ...s, family: familyId }));
        renderSeriesList();
      } catch (e) {
        document.getElementById('familyName').textContent = 'Error: ' + e.message;
      }
    }
    if (familyId) load();
  </script>
</body>
</html>
