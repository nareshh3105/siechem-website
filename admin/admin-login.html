<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Siechem</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/favicon.png">
<link rel="stylesheet" href="/theme.css">
<style>
  body { background: var(--bg-soft); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-card {
    width: 100%; max-width: 380px; background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 14px; padding: 40px 36px; box-shadow: 0 10px 40px rgba(0,0,0,0.08);
  }
  .login-card h1 { font-size: 20px; margin-bottom: 6px; color: var(--text); }
  .login-card p { font-size: 13.5px; color: var(--text-muted); margin-bottom: 24px; }
  .login-card .input { width: 100%; margin-bottom: 16px; }
  .login-card .btn { width: 100%; justify-content: center; }
  .err { color: #B91C1C; font-size: 13px; margin: -8px 0 16px; display: none; }
</style>
</head>
<body>
  <div class="login-card">
    <h1>Siechem Admin</h1>
    <p>Sign in to edit cable specifications and part numbers.</p>
    <form id="loginForm">
      <input type="password" class="input" id="password" placeholder="Password" autocomplete="current-password" required>
      <div class="err" id="err">Incorrect password.</div>
      <button type="submit" class="btn btn-primary" id="submitBtn">Sign In</button>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const err = document.getElementById('err');
      err.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      try {
        const resp = await fetch('/api/admin-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('password').value })
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'Login failed');
        localStorage.setItem('siechem_admin_token', data.token);
        window.location.href = '/admin/admin.html';
      } catch (e2) {
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
