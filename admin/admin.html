<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Siechem</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/favicon.png">
<link rel="stylesheet" href="/theme.css">
<style>
  .admin-topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 28px; border-bottom: 1px solid var(--border); background: var(--bg-card);
  }
  .admin-topbar .brand { font-weight: 700; font-size: 17px; color: var(--text); }
  .admin-topbar .actions { display: flex; gap: 10px; align-items: center; }
  .admin-wrap { max-width: 1200px; margin: 0 auto; padding: 32px 24px 80px; }
  .segment-block { margin-bottom: 36px; }
  .segment-block h2 {
    font-size: 14px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted);
    margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .family-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .family-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 20px; cursor: pointer; transition: border-color .15s, transform .15s;
    text-decoration: none; display: block;
  }
  .family-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .family-card h3 { font-size: 15px; color: var(--text); margin-bottom: 6px; }
  .family-card p { font-size: 12.5px; color: var(--text-faint); }
  .family-card .count {
    display: inline-block; margin-top: 10px; font-size: 11.5px; font-weight: 600;
    color: var(--accent); background: var(--accent-soft); padding: 3px 10px; border-radius: 20px;
  }
  .family-card .draft-badge {
    display: inline-block; margin-top: 10px; margin-left: 6px; font-size: 11.5px; font-weight: 600;
    color: #92400E; background: #FEF3E2; border: 1px solid #FDE3B0; padding: 3px 10px; border-radius: 20px;
  }
  .loading, .empty { text-align: center; color: var(--text-muted); padding: 60px 0; }
  .publish-bar {
    position: sticky; top: 0; z-index: 5; background: #FEF3E2; border-bottom: 1px solid #FDE3B0;
    padding: 10px 28px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .publish-bar .status { display: flex; flex-direction: column; gap: 2px; }
  .publish-bar span { font-size: 13px; color: #92400E; }
  .publish-bar .sub { font-size: 11.5px; color: #B45309; }
  #publishMsg { font-size: 12.5px; margin-left: 10px; }
</style>
</head>
<body>
  <div class="admin-topbar">
    <div class="brand">Siechem Admin</div>
    <div class="actions">
      <a href="/" class="btn btn-ghost btn-sm">View Site</a>
      <button class="btn btn-ghost btn-sm" onclick="SiechemAdmin.logout()">Log Out</button>
    </div>
  </div>
  <div class="publish-bar">
    <div class="status">
      <span>Edits here are drafts until you publish. Publishing regenerates the live site.</span>
      <span class="sub" id="draftStatus">Checking for unpublished changes…</span>
    </div>
    <div>
      <button class="btn btn-primary btn-sm" id="publishBtn">Publish Changes</button>
      <span id="publishMsg"></span>
    </div>
  </div>
  <div class="admin-wrap">
    <div id="content" class="loading">Loading catalogue…</div>
  </div>

  <script src="/assets/admin.js"></script>
  <script>
    SiechemAdmin.requireAuth();

    function fmtTime(iso) {
      if (!iso) return 'never';
      const d = new Date(iso);
      return d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
    }

    async function load() {
      const el = document.getElementById('content');
      const statusEl = document.getElementById('draftStatus');
      try {
        const { families, lastPublishedAt } = await SiechemAdmin.api('/api/admin-families');
        if (!families.length) {
          el.className = 'empty';
          el.textContent = 'No families found. Run the import script to seed the database.';
          return;
        }
        const draftCount = families.filter(f => f.hasDraftChanges).length;
        statusEl.textContent = draftCount
          ? `${draftCount} famil${draftCount === 1 ? 'y has' : 'ies have'} unpublished changes · last published ${fmtTime(lastPublishedAt)}`
          : `No unpublished changes · last published ${fmtTime(lastPublishedAt)}`;

        const bySegment = {};
        for (const f of families) {
          const seg = f.segment || 'Other';
          (bySegment[seg] = bySegment[seg] || []).push(f);
        }
        el.className = '';
        el.innerHTML = Object.keys(bySegment).sort().map(seg => `
          <div class="segment-block">
            <h2>${seg}</h2>
            <div class="family-grid">
              ${bySegment[seg].map(f => `
                <a class="family-card" href="/admin/admin-family.html?f=${encodeURIComponent(f.id)}">
                  <h3>${f.name}</h3>
                  <p>${(f.summary || '').slice(0, 90)}${(f.summary || '').length > 90 ? '…' : ''}</p>
                  <span class="count">${f.seriesCount} type${f.seriesCount === 1 ? '' : 's'}</span>
                  ${f.hasDraftChanges ? '<span class="draft-badge">Draft</span>' : ''}
                </a>
              `).join('')}
            </div>
          </div>
        `).join('');
      } catch (e) {
        el.className = 'empty';
        el.textContent = 'Failed to load: ' + e.message;
      }
    }
    load();

    document.getElementById('publishBtn').addEventListener('click', async () => {
      const btn = document.getElementById('publishBtn');
      const msg = document.getElementById('publishMsg');
      btn.disabled = true;
      btn.textContent = 'Publishing…';
      msg.style.color = 'var(--text-muted)';
      msg.textContent = '';
      try {
        const result = await SiechemAdmin.api('/api/admin-publish', { method: 'POST' });
        msg.style.color = '#15803D';
        msg.textContent = `Published ${result.families} families, ${result.series} types. Live in ~1 min.`;
        load();
      } catch (e) {
        msg.style.color = '#B91C1C';
        msg.textContent = 'Publish failed: ' + e.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Publish Changes';
      }
    });
  </script>
</body>
</html>
