<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Siechem</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/favicon.png">
<link rel="stylesheet" href="/theme.css">
<style>
  body { background: var(--bg-soft); }
  .admin-topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px; border-bottom: 1px solid var(--border); background: var(--bg-card);
    position: sticky; top: 0; z-index: 10;
  }
  .admin-topbar .brand { display: flex; align-items: center; gap: 10px; }
  .admin-topbar .brand img { height: 28px; border-radius: 4px; }
  .admin-topbar .brand span { font-weight: 700; font-size: 15.5px; color: var(--text); }
  .admin-topbar .actions { display: flex; gap: 10px; align-items: center; }

  .publish-bar {
    position: sticky; top: 57px; z-index: 9;
    background: #FFF9F0;
    border-bottom: 1px solid #FDE3B0;
    padding: 11px 28px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .publish-bar .status { display: flex; align-items: center; gap: 9px; }
  .publish-bar .status svg { flex-shrink: 0; color: #B45309; }
  .publish-bar .status-text { display: flex; flex-direction: column; gap: 1px; }
  .publish-bar .status-text span:first-child { font-size: 12.5px; color: #7C2D12; font-weight: 600; }
  .publish-bar .sub { font-size: 11px; color: #B45309; }
  #publishMsg { font-size: 12.5px; margin-left: 10px; font-weight: 600; }

  .stat-row { display: flex; gap: 14px; padding: 22px 24px 4px; max-width: 1200px; margin: 0 auto; flex-wrap: wrap; }
  .stat-tile {
    flex: 1; min-width: 140px; background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 18px;
  }
  .stat-tile .num { font-size: 24px; font-weight: 800; color: var(--text); letter-spacing: -0.5px; }
  .stat-tile .lbl { font-size: 11.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }
  .stat-tile.warn .num { color: #B45309; }

  .admin-wrap { max-width: 1200px; margin: 0 auto; padding: 12px 24px 80px; }

  .search-row { margin: 8px 0 26px; position: relative; max-width: 420px; }
  .search-row svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-dim); }
  .search-row input {
    width: 100%; padding: 10px 14px 10px 38px; border: 1.5px solid var(--border); border-radius: 9px;
    font-size: 13.5px; background: var(--bg-card); color: var(--text); outline: none; transition: border-color .15s;
  }
  .search-row input:focus { border-color: var(--accent); }

  .segment-block { margin-bottom: 34px; }
  .segment-block h2 {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); font-weight: 700;
    margin-bottom: 14px; padding-bottom: 9px; border-bottom: 1px solid var(--border);
  }
  .segment-block h2 .seg-count { font-family: var(--mono); font-weight: 500; color: var(--text-dim); font-size: 11.5px; }
  .family-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
  .family-card {
    position: relative; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 20px 16px; cursor: pointer; transition: border-color .15s, transform .15s, box-shadow .15s;
    text-decoration: none; display: block; overflow: hidden;
  }
  .family-card::before {
    content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 3px;
    background: var(--accent); opacity: 0; transition: opacity .15s;
  }
  .family-card:hover { border-color: var(--accent-border); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(224,0,0,0.10); }
  .family-card:hover::before { opacity: 1; }
  .family-card h3 { font-size: 15px; color: var(--text); margin-bottom: 6px; font-weight: 700; padding-right: 20px; }
  .family-card p { font-size: 12.5px; color: var(--text-faint); line-height: 1.5; min-height: 36px; }
  .family-card .card-foot { display: flex; align-items: center; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .family-card .count {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600;
    color: var(--accent-2); background: var(--accent-soft); padding: 3px 10px; border-radius: 20px;
  }
  .family-card .draft-badge {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600;
    color: #92400E; background: #FEF3E2; border: 1px solid #FDE3B0; padding: 3px 10px; border-radius: 20px;
  }
  .family-card .draft-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #D97706; }
  .family-card .go-arrow {
    position: absolute; top: 18px; right: 18px; color: var(--text-dim); opacity: 0; transform: translateX(-4px);
    transition: opacity .15s, transform .15s;
  }
  .family-card:hover .go-arrow { opacity: 1; transform: translateX(0); color: var(--accent); }

  .loading, .empty { text-align: center; color: var(--text-muted); padding: 60px 0; }
  .loading .spinner {
    width: 26px; height: 26px; border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; margin: 0 auto 14px; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 640px) {
    .admin-topbar { padding: 12px 16px; }
    .admin-topbar .brand span { font-size: 14px; }
    .admin-topbar .actions { gap: 8px; }
    .admin-topbar .actions .btn-sm { padding: 8px 10px; font-size: 12.5px; }
    /* Sticky-under-sticky is fragile (relies on the topbar's exact height,
       which varies with content/font-loading) — just let it scroll on mobile. */
    .publish-bar { position: static; padding: 11px 16px; }
    .stat-row { padding: 16px 16px 4px; gap: 10px; }
    .admin-wrap { padding: 12px 16px 80px; }
    .family-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="admin-topbar">
    <div class="brand"><img src="/assets/logo.jpg" alt="Siechem"><span>Siechem Admin</span></div>
    <div class="actions">
      <a href="/" class="btn btn-ghost btn-sm">View Site</a>
      <button class="btn btn-ghost btn-sm" onclick="SiechemAdmin.logout()">Log Out</button>
    </div>
  </div>
  <div class="publish-bar">
    <div class="status">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2l8 4v6c0 5-3.5 9-8 10-4.5-1-8-5-8-10V6l8-4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <div class="status-text">
        <span>Edits here are drafts until you publish</span>
        <span class="sub" id="draftStatus">Checking for unpublished changes…</span>
      </div>
    </div>
    <div>
      <button class="btn btn-primary btn-sm" id="publishBtn">Publish Changes</button>
      <span id="publishMsg"></span>
    </div>
  </div>

  <div class="stat-row" id="statRow" style="display:none;">
    <div class="stat-tile"><div class="num" id="statFamilies">–</div><div class="lbl">Segments</div></div>
    <div class="stat-tile"><div class="num" id="statTypes">–</div><div class="lbl">Cable Types</div></div>
    <div class="stat-tile warn"><div class="num" id="statDraft">–</div><div class="lbl">Unpublished</div></div>
  </div>

  <div class="admin-wrap">
    <div class="search-row">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="text" id="searchInput" placeholder="Search segments (e.g. Automotive, Aerospace)…" autocomplete="off">
    </div>
    <div id="content" class="loading"><div class="spinner"></div>Loading catalogue…</div>
  </div>

  <script src="/assets/admin.js"></script>
  <script>
    SiechemAdmin.requireAuth();

    let allFamilies = [];
    let lastPublishedAtGlobal = null;

    function fmtTime(iso) {
      if (!iso) return 'never';
      const d = new Date(iso);
      return d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
    }

    function renderFamilies(families) {
      const el = document.getElementById('content');
      if (!families.length) {
        el.className = 'empty';
        el.textContent = 'No segments match your search.';
        return;
      }
      const bySegment = {};
      for (const f of families) {
        const seg = f.segment || 'Other';
        (bySegment[seg] = bySegment[seg] || []).push(f);
      }
      el.className = '';
      el.innerHTML = Object.keys(bySegment).sort().map(seg => `
        <div class="segment-block">
          <h2>${seg} <span class="seg-count">(${bySegment[seg].length})</span></h2>
          <div class="family-grid">
            ${bySegment[seg].map(f => `
              <a class="family-card" href="/admin/admin-family.html?f=${encodeURIComponent(f.id)}">
                <svg class="go-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <h3>${f.name}</h3>
                <p>${(f.summary || '').slice(0, 90)}${(f.summary || '').length > 90 ? '…' : ''}</p>
                <div class="card-foot">
                  <span class="count">${f.seriesCount} type${f.seriesCount === 1 ? '' : 's'}</span>
                  ${f.hasDraftChanges ? '<span class="draft-badge">Draft</span>' : ''}
                </div>
              </a>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    async function load() {
      const el = document.getElementById('content');
      const statusEl = document.getElementById('draftStatus');
      try {
        const { families, lastPublishedAt } = await SiechemAdmin.api('/api/admin-families');
        allFamilies = families;
        lastPublishedAtGlobal = lastPublishedAt;
        if (!families.length) {
          el.className = 'empty';
          el.textContent = 'No families found. Run the import script to seed the database.';
          return;
        }
        const draftCount = families.filter(f => f.hasDraftChanges).length;
        statusEl.textContent = draftCount
          ? `${draftCount} famil${draftCount === 1 ? 'y has' : 'ies have'} unpublished changes · last published ${fmtTime(lastPublishedAt)}`
          : `No unpublished changes · last published ${fmtTime(lastPublishedAt)}`;

        const totalTypes = families.reduce((sum, f) => sum + f.seriesCount, 0);
        document.getElementById('statFamilies').textContent = families.length;
        document.getElementById('statTypes').textContent = totalTypes.toLocaleString();
        document.getElementById('statDraft').textContent = draftCount;
        document.getElementById('statRow').style.display = '';

        renderFamilies(families);
      } catch (e) {
        el.className = 'empty';
        el.textContent = 'Failed to load: ' + e.message;
      }
    }
    load();

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      const filtered = !q ? allFamilies : allFamilies.filter(f =>
        f.name.toLowerCase().includes(q) || (f.segment || '').toLowerCase().includes(q)
      );
      renderFamilies(filtered);
    });

    document.getElementById('publishBtn').addEventListener('click', async () => {
      const btn = document.getElementById('publishBtn');
      const msg = document.getElementById('publishMsg');
      btn.disabled = true;
      btn.textContent = 'Publishing…';
      msg.style.color = 'var(--text-muted)';
      msg.textContent = '';
      try {
        const result = await SiechemAdmin.api('/api/admin-publish', { method: 'POST' });
        msg.style.color = '#15803D';
        msg.textContent = `Published ${result.families} families, ${result.series} types. Live in ~1 min.`;
        load();
      } catch (e) {
        msg.style.color = '#B91C1C';
        msg.textContent = 'Publish failed: ' + e.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Publish Changes';
      }
    });
  </script>
</body>
</html>
